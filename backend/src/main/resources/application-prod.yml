spring:
  main:
    banner-mode: off
  docker:
    compose:
      enabled: false
  datasource:
    # Database connection settings must be provided via environment variables.
    url: ...
    username: ...
    password: ...
  security:
    oauth2:
      resourceserver:
        jwt:
          # OAuth2 / OpenID Connect issuer URI must be provided via environment variables.
          issuer-uri: ...
  ai:
    openai:
      # OpenAI API key must be provided via environment variables (https://platform.openai.com/api-keys)
      api-key: ...
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false