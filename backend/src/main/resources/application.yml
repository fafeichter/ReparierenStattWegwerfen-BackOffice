spring:
  application:
    name: Reparieren Statt Wegwerfen - Backoffice
  threads:
    virtual:
      enabled: true
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: archive
  ai:
    openai:
      chat:
        model: gpt-5.5
        reasoning-effort: medium
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

springdoc:
  default-produces-media-type: application/json