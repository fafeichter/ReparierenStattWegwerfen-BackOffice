spring:
  docker:
    compose:
      lifecycle-management: start_only
  datasource:
    url: jdbc:mysql://localhost:3306/reparieren-statt-wegwefen?serverTimezone=Europe/Vienna
    username: reparieren-statt-wegwerfen
    password: reparieren-statt-wegwerfen
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/reparieren-statt-wegwerfen-backoffice
  ai:
    openai:
      api-key: ${OPENAI_API_KEY} # See `secrets.env`
    google:
      genai:
        api-key: ${GEMINI_API_KEY} # See `secrets.env`

management:
  endpoints:
    web:
      cors:
        allowed-origins: http://localhost:4200
        allowed-methods: GET

logging:
  level:
    at.reparierenstattwegwerfen.backoffice: DEBUG