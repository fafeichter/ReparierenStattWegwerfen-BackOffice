services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    environment:
      TZ: ${TIMEZONE}
      LANG: C.UTF-8
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '3306'
    volumes:
      - reparierenstattwegwerfen-backoffice-mysql-data:/var/lib/mysql/
      - ./keycloak-database.sql:/docker-entrypoint-initdb.d/001-keycloak-database.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: reparierenstattwegwerfen-backoffice-keycloak
    environment:
      TZ: ${TIMEZONE}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/${KEYCLOAK_DATABASE}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DATABASE}
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
      KC_HEALTH_ENABLED: true
    command: start-dev --import-realm
    ports:
      - "9000:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - reparierenstattwegwerfen-backoffice-keycloak-data:/opt/keycloak/data
      - ./keycloak-realm.json:/opt/keycloak/data/import/reparieren-statt-wegwerfen-backoffice-realm.json
    healthcheck:
      test: [ "CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  reparierenstattwegwerfen-backoffice-mysql-data:
    driver: local
  reparierenstattwegwerfen-backoffice-keycloak-data:
    driver: local