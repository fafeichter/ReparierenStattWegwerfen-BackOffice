name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build application
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.9.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build testClasses -x test
      - name: Upload Angular build output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-static-resources
          path: frontend/dist/browser/
          retention-days: 1

  test-backend:
    name: Run backend tests
    needs: [ build ]
    runs-on: ubuntu-26.04
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run backend tests
        run: ./gradlew :backend:test
      - name: Publish rest report
        if: success() || failure()
        uses: ScalableCapital/action-surefire-report@v2
        with:
          check_name: Backend tests
          report_paths: 'backend/build/test-results/test/TEST-*.xml'

  test-frontend:
    name: Run frontend tests
    needs: [ build ]
    runs-on: ubuntu-26.04
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.9.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run frontend tests
        run: ./gradlew :frontend:npmTest
      - name: Publish rest report
        if: success() || failure()
        uses: ScalableCapital/action-surefire-report@v2
        with:
          check_name: Frontend tests
          report_paths: 'frontend/build/test-results/TEST-*.xml'

  artifact:
    name: Build and publish artifact
    needs: [ test-backend, test-frontend ]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download Angular build output
        uses: actions/download-artifact@v8
        with:
          name: frontend-static-resources
          path: frontend/dist/browser/
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build Docker image
        env:
          SPRING_PROFILES_ACTIVE: prod,native
        run: |
          ./gradlew :backend:bootBuildImage \
            -x test \
            -PskipFrontendBuild=true
      - name: Login to private container registry
        uses: docker/login-action@v4
        with:
          registry: registry.fabian-feichter.at
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push Docker image
        run: docker push registry.fabian-feichter.at/reparieren-statt-wegwerfen-backoffice:latest

  deploy:
    name: Deploy artifact
    needs: [ artifact ]
    runs-on: ubuntu-26.04
    environment: Production
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PRODUCTION_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Run remote deployment script
        run: >-
          ssh ${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}
          "sh /cloud/scripts/reparieren-statt-wegwerfen-backoffice-deploy.sh"