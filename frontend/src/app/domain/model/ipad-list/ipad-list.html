<clr-datagrid [clrDgLoading]="ipadsLoading()">
  <clr-dg-column>Model Code</clr-dg-column>
  <clr-dg-column>Name
    <clr-dg-string-filter [clrDgStringFilter]="nameFilter"></clr-dg-string-filter>
  </clr-dg-column>
  <clr-dg-column
    [clrDgSortBy]="releaseDateComparator"
    [clrDgSortOrder]="ClrDatagridSortOrder.ASC">
    Released
    <clr-dg-string-filter [clrDgStringFilter]="releaseDateFilter"></clr-dg-string-filter>
  </clr-dg-column>
  <clr-dg-row *clrDgItems="let model of ipads()">
    <clr-dg-cell>
      <a [routerLink]="['/models', model.id]">{{ model.modelNumber }}</a>
    </clr-dg-cell>
    <clr-dg-cell>{{ model.name }}</clr-dg-cell>
    <clr-dg-cell>
      {{ createDate(model.releaseYear, model.releaseMonth - 1) | date:'MMM' }}
      {{ model.releaseYear }}
    </clr-dg-cell>
  </clr-dg-row>
  <clr-dg-footer>{{ ipads().length }} models</clr-dg-footer>
</clr-datagrid>
