<clr-card [id]="navItem().id">
  <clr-card-header>
    <cds-icon [shape]="navItem().icon" size="lg"/>
    {{ navItem().label }}
  </clr-card-header>
  <div class="card-block">
    <dl>
      <dt>Sale invoice number</dt>
      <dd>
        {{ saleInvoiceNumber() | orElse }}
      </dd>
    </dl>
  </div>
</clr-card>
