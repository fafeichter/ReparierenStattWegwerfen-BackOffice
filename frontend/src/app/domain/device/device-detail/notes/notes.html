<clr-card [id]="navItem().id">
  <clr-card-header>
    <cds-icon [shape]="navItem().icon" size="lg"/>
    {{ navItem().label }}
  </clr-card-header>
  <div class="card-block">
    <table class="table">
      <thead>
      <tr>
        <th class="left">
          Text
        </th>
        <th class="right">
          Date
        </th>
      </tr>
      </thead>
      <tbody>
        @for (note of deviceNotes(); track note.noteId) {
          <tr>
            <td class="left">
              {{ note.text }}
              <button (click)="activateEditMode(note.noteId)" class="btn btn-link btn-icon" type="button">
                <cds-icon shape="pencil" size="xs"/>
                Edit
              </button>
              <button (click)="deleteNote(note.noteId)" class="btn btn-link btn-icon ml-1!" type="button">
                <cds-icon shape="trash" size="xs"/>
                Delete
              </button>
            </td>
            <td class="right">
              {{ note.date | date:'dd.MM.yyyy HH:mm:ss' }}
            </td>
          </tr>
        } @empty {
          <tr>
            <td class="text-center" colspan="2">
              No notes
            </td>
          </tr>
        }
      </tbody>
    </table>
    <button (click)="addNoteModalOpen.set(true)" class="btn btn-link" type="button">
      <cds-icon shape="plus"/>
      Add
    </button>
  </div>
</clr-card>

@if (addNoteModalOpen()) {
  <app-note-add-modal (saved)="deviceNotesResource.reload()" [(modalOpen)]="addNoteModalOpen"
                      [deviceId]="deviceId()"/>
}
@if (editNoteModalOpen() && noteInEditMode(); as note) {
  <app-note-edit-modal (saved)="deviceNotesResource.reload()"
                       [(modalOpen)]="editNoteModalOpen"
                       [deviceId]="deviceId()"
                       [note]="note"/>
}
