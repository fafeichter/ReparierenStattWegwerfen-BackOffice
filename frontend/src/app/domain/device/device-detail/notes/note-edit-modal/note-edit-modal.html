<clr-modal [(clrModalOpen)]="modalOpen" [clrModalStaticBackdrop]="false" clrModalSize="l">
  <div class="modal-title">
    Edit note
  </div>
  <div class="modal-body">
    <form (ngSubmit)="editNote()" [formGroup]="form" autocomplete="off" clrForm>
      <clr-textarea-container>
        <label class="clr-required-mark">
          Text
        </label>
        <textarea class="w-full!" clrTextarea formControlName="text" name="text" required rows="2"></textarea>
        <clr-control-error *clrIfError="'required'">
          Text is required
        </clr-control-error>
      </clr-textarea-container>
    </form>
  </div>
  <div class="modal-footer">
    <button (click)="modalOpen.set(false)" class="btn btn-outline btn-link" type="button">
      <cds-icon shape="close"/>
      Cancel
    </button>
    <button (click)="editNote()" [disabled]="form.invalid || isSubmitting()" class="btn btn-primary" type="submit">
      @if (isSubmitting()) {
        <span class="spinner spinner-inline"></span>
        Editing note...
      } @else {
        Edit note
      }
    </button>
  </div>
</clr-modal>
