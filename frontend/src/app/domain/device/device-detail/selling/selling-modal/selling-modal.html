<clr-modal [(clrModalOpen)]="modalOpen" [clrModalStaticBackdrop]="false">
  <h3 class="modal-title">
    Set selling details
  </h3>
  <div class="modal-body">
    <form (ngSubmit)="setSellingDetails()" [formGroup]="form" autocomplete="off" clrForm clrLabelSize="3">
      <clr-number-input-container>
        <label class="clr-required-mark">
          Price
        </label>
        <input clrNumberInput formControlName="sellingPrice" prefix="€" type="number"/>
        <clr-control-error *clrIfError="'required'">
          Price is required
        </clr-control-error>
        <clr-control-error *clrIfError="'min'">
          Please enter a valid price
        </clr-control-error>
      </clr-number-input-container>
      <clr-date-container>
        <label class="clr-required-mark">
          Selling date
        </label>
        <input [max]="(now | date:'yyyy-MM-dd')!" clrDate formControlName="sellingDate" type="date"/>
        <clr-control-error *clrIfError="'required'">
          Buying date is required
        </clr-control-error>
        <clr-control-error *clrIfError="'futureDate'">
          Date must be in past or present
        </clr-control-error>
      </clr-date-container>
    </form>
  </div>
  <div class="modal-footer">
    <button (click)="modalOpen.set(false); modalCanceled.emit()" class="btn btn-outline btn-link" type="button">
      Cancel
    </button>
    <button (click)="setSellingDetails()" [disabled]="form.invalid || isSubmitting()" class="btn btn-primary"
            type="submit">
      @if (isSubmitting()) {
        <span class="spinner spinner-inline"></span>
      }
      {{ isSubmitting() ? 'Setting status to sold...' : 'Set status to sold' }}
    </button>
  </div>
</clr-modal>
