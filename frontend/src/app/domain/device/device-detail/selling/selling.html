<clr-card [id]="navItem().id">
  <clr-card-header>
    <cds-icon [shape]="navItem().icon" size="lg"/>
    {{ navItem().label }}
  </clr-card-header>
  <div class="card-block">
    <app-accessories [deviceId]="deviceId()"/>
    <hr>
    <app-sale [deviceId]="deviceId()"/>
    <hr>
    <app-invoice [deviceId]="deviceId()"/>
  </div>
</clr-card>
