<clr-card [id]="navItem().id">
  <clr-card-header>
    <cds-icon [shape]="navItem().icon" size="lg"/>
    {{ navItem().label }}
  </clr-card-header>
  <div class="card-block">
    <table class="table">
      <thead>
      <tr>
        <th class="left w-1/3">
          Action
        </th>
        <th class="left w-1/3">
          Value
        </th>
        <th class="center w-1/6">
          Actor
        </th>
        <th class="right w-1/6">
          Date
        </th>
      </tr>
      </thead>
      <tbody>
        @for (activity of deviceActivities(); track activity.deviceActivityId; let i = $index) {
          <tr [class.collapsed]="!expanded() && i >= visibleRowCount">
            <td class="left">
              {{ activity.action }}
            </td>
            <td class="left">
              {{ activity.value }}
            </td>
            <td class="center">
              {{ activity.actor }}
            </td>
            <td class="right">
              {{ activity.date | date:'dd. MMM yyyy HH:mm:ss' }}
            </td>
          </tr>
        }
      </tbody>
      @if (hiddenRowCount() > 0) {
        <tfoot>
        <tr>
          <td class="center" colspan="4">
            <button (click)="expanded.set(!expanded())" [attr.aria-expanded]="expanded()"
                    class="btn btn-link btn-sm toggle-rows" type="button">
              <cds-icon [direction]="expanded() ? 'up' : 'down'" shape="angle"/>
              @if (expanded()) {
                Show less
              } @else {
                Show {{ hiddenRowCount() }} more
              }
            </button>
          </td>
        </tr>
        </tfoot>
      }
    </table>
  </div>
</clr-card>
