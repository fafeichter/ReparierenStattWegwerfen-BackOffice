<clr-modal [(clrModalOpen)]="modalOpen" [clrModalStaticBackdrop]="false" clrModalSize="lg">
  <div class="modal-title">
    Set defects
  </div>
  <div class="modal-body">
    <form (ngSubmit)="updateDefects()" [formGroup]="defectsForm" autocomplete="off" clrForm>
      <clr-textarea-container>
        <label class="clr-required-mark">
          Reported Defect
        </label>
        <textarea appAutofocus class="w-full!" clrTextarea formControlName="reportedDefect" required
                  rows="2"></textarea>
      </clr-textarea-container>
      <clr-textarea-container>
        <label>
          Corrected Defect
        </label>
        <textarea autofocus class="w-full!" clrTextarea formControlName="correctedDefect" rows="4"></textarea>
      </clr-textarea-container>
    </form>
  </div>
  <div class="modal-footer">
    <button (click)="modalOpen.set(false)" class="btn btn-outline btn-link" type="button">
      <cds-icon shape="close"/>
      Cancel
    </button>
    <button (click)="updateDefects()" [clrLoading]="isSubmitting()" [disabled]="defectsForm.invalid"
            class="btn btn-primary"
            type="submit">
      Set Defects
    </button>
  </div>
</clr-modal>
