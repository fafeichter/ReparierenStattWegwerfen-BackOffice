<div class="card" id="buying">
  <div class="card-header">Buying</div>
  <div class="card-block">
    <dl>
      <dt>Date</dt>
      <dd>
        {{ deviceBuying()?.date | date:'dd.MM.yyyy' }}
      </dd>
      <dt>Price</dt>
      <dd>
        {{ deviceBuying()?.price | currency:'EUR':'symbol':'1.2-2' }}
      </dd>
      <dt>URL</dt>
      <dd>
        <a [href]="deviceBuying()?.url" target="_blank">{{ deviceBuying()?.url }}
          <cds-icon role="img" shape="pop-out"/>
        </a>
      </dd>
    </dl>
    <hr>

    <dl>
      <dt>Seller</dt>
      <dd>
        <a [routerLink]="['/businesspartners', deviceBuying()?.seller?.id]">
          {{ deviceBuying()?.seller?.name }}
        </a>
        <button
          [queryParams]="{ 'edit-address': true, 'device-id':  deviceId()}"
          [routerLink]="['/businesspartners', deviceBuying()?.seller?.id]"
          class="btn btn-link ml-1!">
          <cds-icon role="img" shape="pop-out"/>
          Edit
        </button>
      </dd>
    </dl>
  </div>
</div>
