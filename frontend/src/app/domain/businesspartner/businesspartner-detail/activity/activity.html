<div class="card" id="activity">
  <div class="card-header">Activity</div>
  <div class="card-block">
    <table class="table">
      <thead>
      <tr>
        <th class="left w-1/3">Action</th>
        <th class="left w-1/3">Value</th>
        <th class="left w-1/6">Actor</th>
        <th class="right w-1/6">Date</th>
      </tr>
      </thead>
      <tbody>
        @for (activity of businessPartnerActivities(); track activity.id) {
          <tr>
            <td class="left w-1/3">{{ activity.action }}</td>
            <td class="left w-1/3">{{ activity.value }}</td>
            <td class="left w-1/6">{{ activity.actor }}</td>
            <td class="right w-1/6">{{ activity.date | date:'dd.MMM yyyy HH:mm:ss' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
