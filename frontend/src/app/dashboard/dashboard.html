<div class="clr-row">
  <div class="clr-col-lg-12 clr-col-sm-12 clr-col-12">
    <div class="card">
      <div class="card-header">
        Dashboard
      </div>
      <div class="card-block">
        <div class="clr-row">
          <div class="clr-col-12 clr-col-lg-6 clr-col-xl-4">
            <h4>Bestellt / gekauft: {{ orderedCount }}
              <app-add-device/>
            </h4>
            <app-devices-ordered (devicesOrderedCount)="orderedCount = $event"/>
          </div>
          <div class="clr-col-12 clr-col-lg-6 clr-col-xl-4">
            <h4>Zum Fertigstellen: {{ toFinishCount }}</h4>
            <app-devices-to-finish (devicesToFinishCount)="toFinishCount = $event"/>
          </div>
          <div class="clr-col-12 clr-col-lg-6 clr-col-xl-4">
            <h4>Zum Verkauf angeboten: {{ offeredForSaleCount }}</h4>
            <app-devices-offered-for-sale (devicesOfferedForSaleCount)="offeredForSaleCount = $event"/>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
