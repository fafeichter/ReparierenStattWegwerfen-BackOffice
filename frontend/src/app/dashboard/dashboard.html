<div class="clr-row">
  <div class="clr-col-lg-12 clr-col-sm-12 clr-col-12">
    <clr-card>
      <div class="card-block">
        <div class="clr-row">
          <div class="clr-col-12 clr-col-lg-6 clr-col-xl-4">
            <h4 class="mt-2!">
              <cds-icon shape="calendar" size="lg"/>
              Bestellt / gekauft: {{ orderedCount() }}
              <app-add-device/>
            </h4>
            <app-devices-ordered (devicesOrderedCount)="orderedCount.set($event)"/>
          </div>
          <div class="clr-col-12 clr-col-lg-6 clr-col-xl-4">
            <h4 class="mt-2!">
              <cds-icon shape="hourglass" size="lg"/>
              Zum Fertigstellen: {{ toFinishCount() }}
            </h4>
            <app-devices-to-finish (devicesToFinishCount)="toFinishCount.set($event)"/>
          </div>
          <div class="clr-col-12 clr-col-lg-6 clr-col-xl-4">
            <h4 class="mt-2!">
              <cds-icon shape="tags" size="lg"/>
              Zum Verkauf angeboten: {{ offeredForSaleCount() }}
            </h4>
            <app-devices-offered-for-sale (devicesOfferedForSaleCount)="offeredForSaleCount.set($event)"/>
          </div>
        </div>
      </div>
    </clr-card>
  </div>
</div>
<div class="clr-row">
  <div class="clr-col-lg-4 clr-col-sm-6 clr-col-12">
    <clr-card>
      <clr-card-header>
        <clr-icon shape="search" size="lg"/>
        Search Device
      </clr-card-header>
      <div class="card-block">
        <app-device-search/>
      </div>
    </clr-card>
  </div>
</div>
