<clr-vertical-nav [clrVerticalNavCollapsed]="isMobile()" [clrVerticalNavCollapsible]="true">
  <a [routerLink]="['/dashboard']" clrVerticalNavLink routerLinkActive="active">
    <cds-icon clrVerticalNavIcon shape="home"/>
    Dashboard
  </a>
  <div class="nav-divider"></div>
  <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="true" routerLinkActive="active">
    <cds-icon clrVerticalNavIcon shape="computer"/>
    Devices
    <clr-vertical-nav-group-children>
      <a [routerLink]="['/normal/pidgey']" clrVerticalNavLink routerLinkActive="active">Ordered</a>
      <a [routerLink]="['/normal/pidgey']" clrVerticalNavLink routerLinkActive="active">In progress</a>
      <a [routerLink]="['/normal/pidgey']" clrVerticalNavLink routerLinkActive="active">Done</a>
    </clr-vertical-nav-group-children>
  </clr-vertical-nav-group>
  <div class="nav-divider"></div>
  <a [routerLink]="['/businesspartners']" clrVerticalNavLink routerLinkActive="active">
    <cds-icon clrVerticalNavIcon shape="user"/>
    Business Partners
  </a>
  <a [queryParams]="{ type: 'macbook' }" [routerLink]="['/models']" clrVerticalNavLink routerLinkActive="active">
    <cds-icon clrVerticalNavIcon shape="pod"/>
    Models
  </a>
  <div class="nav-divider"></div>
  <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="true" routerLinkActive="active">
    <cds-icon clrVerticalNavIcon shape="analytics"/>
    Statistics
    <clr-vertical-nav-group-children>
      <a [routerLink]="['/normal/pidgey']" clrVerticalNavLink routerLinkActive="active">By month</a>
      <a [routerLink]="['/normal/pidgey']" clrVerticalNavLink routerLinkActive="active">By quarter</a>
      <a [routerLink]="['/normal/pidgey']" clrVerticalNavLink routerLinkActive="active">Total</a>
    </clr-vertical-nav-group-children>
  </clr-vertical-nav-group>
</clr-vertical-nav>
